# 我们的 profile 补丁层（覆盖上游快照里那份 17 KB 的 Android 适配补丁）。
#
# 原则：只用官方 @deepseek-ai/* 插件，不引入 @dsh-android/* 那套依赖 Kotlin 壳服务的
# 组件（Shizuku / ADB / 虚拟屏 / 文件打开 / 响应式 UI 皮肤）——我们要的是原生 DSH，
# 壳是我们自己的 Java 壳，只负责装快照、起 node、开 WebView。
#
# 插件树本体来自 profile package.json 的 dsh.profile.bundles：
#   @deepseek-ai/dsh-base + @deepseek-ai/dsh-web-app
# 这里只覆盖少量用户可见的设置项。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
# 右栏「浏览器」标签页：上游默认只在 desktop profile 开，web profile 要显式 opt in。
- id: ui-sidebar-browser
  name: "@deepseek-ai/dsh-client-ui-sidebar-browser"
  disabled: false

# 终端用的 bash：默认值是 "/bin/bash"（Android 上没有），显式钉到快照自带的 bash。
# 这条也是「终端打开错误」的正解：不靠 PATH 猜。
- id: terminal-bash
  name: "@deepseek-ai/dsh-terminal-bash"
  config:
    shellPath: /data/data/dev.dsh.harness/files/usr/bin/bash
